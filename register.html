<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinBuddy - สร้างบัญชี</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        .profile-upload {
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        .profile-upload:hover {
            transform: scale(1.02);
        }
        .upload-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 9999px;
        }
        .profile-upload:hover .upload-overlay {
            opacity: 1;
        }
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto p-6 bg-white rounded-lg shadow-lg mt-10">
        <h1 class="text-2xl font-bold text-green-600 text-center mb-6">BinBuddy</h1>
        <p class="text-center text-gray-600 mb-6">สร้างบัญชีใหม่เพื่อเริ่มการแยกขยะ</p>
        <form id="registerForm" method="POST" action="register.php" enctype="multipart/form-data">
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">ชื่อ-นามสกุล</label>
                <input type="text" name="name" class="w-full px-3 py-2 border rounded-lg" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">อีเมล</label>
                <input type="email" name="email" class="w-full px-3 py-2 border rounded-lg" required>
            </div>
            <div class="mb-4 password-container">
                <label class="block text-gray-700 mb-2">รหัสผ่าน</label>
                <input type="password" name="password" id="password" class="w-full px-3 py-2 border rounded-lg" required autocomplete="new-password">
               
            </div>
            <div class="mb-4 password-container">
                <label class="block text-gray-700 mb-2">ยืนยันรหัสผ่าน</label>
                <input type="password" name="confirm_password" id="confirm_password" class="w-full px-3 py-2 border rounded-lg" required>
               
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">รูปโปรไฟล์</label>
                <div class="avatar-container">
                    <div class="profile-upload">
                        <img id="previewImage" src="img/default-avatar.svg" alt="Profile" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-lg" onload="this.style.display='block'">
                        <div class="upload-overlay">
                            <label for="profileImageUpload" class="cursor-pointer text-white text-center">
                                <i class="fas fa-camera text-xl mb-1"></i>
                                <p class="text-xs">เลือกรูปภาพ</p>
                                <input type="file" id="profileImageUpload" name="profile_image" accept="image/*" class="hidden">
                            </label>
                        </div>
                    </div>
                    <button type="button" id="randomAvatar" class="border border-gray-400 text-gray-600 rounded-full w-10 h-10 flex items-center justify-center hover:text-gray-800 hover:border-gray-600">
                        <i class="fas fa-random"></i>
                    </button>
                </div>
                <p class="text-sm text-gray-500 mt-2">ขนาดไฟล์สูงสุด: 5MB (รองรับ: JPG, PNG, GIF)</p>
                <input type="hidden" id="avatarSeedInput" name="avatarSeed">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">ลงทะเบียน</button>
            <p class="text-center text-gray-500 mt-4">มีบัญชีอยู่แล้ว? <a href="login.html" class="text-green-600">เข้าสู่ระบบ</a></p>
        </form>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script>
        // เก็บ seed ปัจจุบัน
        let currentAvatarSeed = Math.random().toString(36).substring(7);
        document.getElementById('previewImage').src = `https://api.dicebear.com/9.x/avataaars/svg?seed=${currentAvatarSeed}`;
        document.getElementById('avatarSeedInput').value = currentAvatarSeed;

        // ฟังก์ชันสลับการมองเห็นรหัสผ่าน
        function togglePassword(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const icon = document.getElementById(`toggle${fieldId.charAt(0).toUpperCase() + fieldId.slice(1)}Icon`);
            if (passwordField.type === "password") {
                passwordField.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                passwordField.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        // ฟังก์ชันสุ่มรูปโปรไฟล์
        document.getElementById('randomAvatar').addEventListener('click', function() {
            currentAvatarSeed = Math.random().toString(36).substring(7);
            document.getElementById('previewImage').src = `https://api.dicebear.com/9.x/avataaars/svg?seed=${currentAvatarSeed}`;
            document.getElementById('avatarSeedInput').value = currentAvatarSeed;
        });

        // ฟังก์ชันแสดงตัวอย่างรูปภาพที่อัปโหลด
        document.getElementById('profileImageUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    Swal.fire({
                        icon: 'error',
                        title: 'ข้อผิดพลาด',
                        text: 'ไฟล์มีขนาดเกิน 5MB',
                        confirmButtonColor: '#10b981',
                        customClass: {
                            popup: 'rounded-lg'
                        }
                    });
                    this.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImage').src = e.target.result;
                    // ลบ seed เมื่ออัปโหลดรูปภาพ
                    document.getElementById('avatarSeedInput').value = '';
                }
                reader.readAsDataURL(file);
            }
        });

        // ฟังก์ชันส่งฟอร์ม
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'ข้อผิดพลาด',
                    text: 'รหัสผ่านและรหัสผ่านยืนยันไม่ตรงกัน',
                    confirmButtonColor: '#10b981',
                    customClass: {
                        popup: 'rounded-lg'
                    }
                });
                return;
            }

            const formData = new FormData(this);

            try {
                const response = await fetch('register.php', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ',
                        text: result.message,
                        confirmButtonColor: '#10b981',
                        customClass: {
                            popup: 'rounded-lg'
                        }
                    }).then(() => {
                        window.location.href = 'main.php';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'ข้อผิดพลาด',
                        text: result.message,
                        confirmButtonColor: '#10b981',
                        customClass: {
                            popup: 'rounded-lg'
                        }
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'ข้อผิดพลาด',
                    text: 'เกิดข้อผิดพลาดในการเชื่อมต่อ',
                    confirmButtonColor: '#10b981',
                    customClass: {
                        popup: 'rounded-lg'
                    }
                });
            }
        });
    </script>
</body>
</html>
