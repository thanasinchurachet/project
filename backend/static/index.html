<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Classification - สแกนขยะอัจฉริยะ</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .glass-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            transition: all 0.3s ease;
        }

        .glass-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.15);
        }

        .upload-area {
            border: 3px dashed #4CAF50;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #2e7d32;
            background: linear-gradient(145deg, #e8f5e8, #d5e7d5);
            transform: scale(1.02);
        }

        .upload-area.dragover {
            border-color: #1976d2;
            background: linear-gradient(145deg, #e3f2fd, #bbdefb);
        }

        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            margin: 1rem 0;
            transition: all 0.3s ease;
        }

        .image-preview:hover {
            transform: scale(1.05);
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #2e7d32);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #2196F3, #1565c0);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.4);
        }

        .result-card {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            border-radius: 15px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #4CAF50;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(76, 175, 80, 0.3);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .waste-type-badge {
            display: inline-block;
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin: 5px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .confidence-bar {
            background: linear-gradient(90deg, #e0e0e0, #f5f5f5);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 5px;
            transition: width 1s ease;
        }

        .info-card {
            background: linear-gradient(145deg, #e3f2fd, #bbdefb);
            border-radius: 10px;
            padding: 1rem;
            margin: 0.5rem 0;
            border-left: 4px solid #2196F3;
        }

        .error-card {
            background: linear-gradient(145deg, #ffebee, #ffcdd2);
            border-radius: 10px;
            padding: 1rem;
            margin: 0.5rem 0;
            border-left: 4px solid #f44336;
        }

        .camera-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(33, 150, 243, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        }

        .camera-button:hover {
            background: rgba(33, 150, 243, 1);
            transform: scale(1.1);
        }

        .hidden { display: none; }
        
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .title-gradient {
            background: linear-gradient(45deg, #4CAF50, #2e7d32);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold title-gradient mb-2">
                <i class="fas fa-recycle mr-2"></i>สแกนขยะอัจฉริยะ
            </h1>
            <p class="text-gray-600 text-lg">ระบบ AI จำแนกประเภทขยะอัตโนมัติ</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <button class="camera-button" id="cameraBtn" title="ถ่ายรูป">
                <i class="fas fa-camera"></i>
            </button>
            
            <div id="uploadContent">
                <i class="fas fa-cloud-upload-alt text-5xl text-green-500 mb-4"></i>
                <h3 class="text-xl font-semibold text-gray-700 mb-2">อัปโหลดภาพขยะ</h3>
                <p class="text-gray-500 mb-4">ลากและวางไฟล์ หรือคลิกเพื่อเลือกไฟล์</p>
                <button class="btn-primary">
                    <i class="fas fa-folder-open mr-2"></i>เลือกไฟล์
                </button>
            </div>

            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <video id="camera" class="hidden" autoplay playsinline></video>
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <div id="imagePreview" class="text-center hidden">
            <img id="previewImg" class="image-preview mx-auto">
            <div class="mt-4 space-x-4">
                <button class="btn-primary" id="scanBtn">
                    <i class="fas fa-search mr-2"></i>เริ่มสแกน
                </button>
                <button class="btn-secondary" id="clearBtn">
                    <i class="fas fa-trash mr-2"></i>ลบรูป
                </button>
            </div>
        </div>

        <div id="result" class="hidden"></div>
    </div>

    <script>
        let currentLat = null;
        let currentLng = null;
        let stream = null;

        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const uploadContent = document.getElementById('uploadContent');
        const cameraBtn = document.getElementById('cameraBtn');
        const camera = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const scanBtn = document.getElementById('scanBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultDiv = document.getElementById('result');

        // Initialize app
        window.onload = function() {
            requestLocation();
            setupEventListeners();
        };

        function setupEventListeners() {
            // File input
            uploadArea.addEventListener('click', () => imageInput.click());
            imageInput.addEventListener('change', handleFileSelect);

            // Drag and drop
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);

            // Camera
            cameraBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleCamera();
            });

            // Buttons
            scanBtn.addEventListener('click', performScan);
            clearBtn.addEventListener('click', clearImage);

            // Camera click to capture
            camera.addEventListener('click', capturePhoto);
        }

        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLng = position.coords.longitude;
                        console.log(`ตำแหน่ง: ${currentLat}, ${currentLng}`);
                    },
                    (error) => {
                        showNotification("ไม่สามารถเข้าถึงตำแหน่งได้", "warning");
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                window.capturedFile = file; // Store file globally
                displayImage(file);
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            uploadArea.classList.add('dragover');
        }

        function handleDragLeave(event) {
            event.preventDefault();
            uploadArea.classList.remove('dragover');
        }

        function handleDrop(event) {
            event.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                window.capturedFile = files[0]; // Store file globally
                displayImage(files[0]);
            }
        }

        function displayImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                uploadContent.classList.add('hidden');
                imagePreview.classList.remove('hidden');
                resultDiv.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function toggleCamera() {
            if (camera.classList.contains('hidden')) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    camera.srcObject = stream;
                    camera.classList.remove('hidden');
                    uploadContent.classList.add('hidden');
                    cameraBtn.innerHTML = '<i class="fas fa-times"></i>';
                } catch (error) {
                    showNotification("ไม่สามารถเข้าถึงกล้องได้", "error");
                }
            } else {
                stopCamera();
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            camera.classList.add('hidden');
            uploadContent.classList.remove('hidden');
            cameraBtn.innerHTML = '<i class="fas fa-camera"></i>';
        }

        function capturePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = camera.videoWidth;
            canvas.height = camera.videoHeight;
            context.drawImage(camera, 0, 0);
            
            canvas.toBlob(blob => {
                const file = new File([blob], 'camera-capture.jpg', { type: 'image/jpeg' });
                
                // Store captured file globally
                window.capturedFile = file;
                
                // Display image
                displayImage(file);
                
                // Create FileList-like object for input
                const dt = new DataTransfer();
                dt.items.add(file);
                imageInput.files = dt.files;
                
                stopCamera();
            }, 'image/jpeg', 0.8);
        }

        function clearImage() {
            imagePreview.classList.add('hidden');
            uploadContent.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            imageInput.value = '';
            window.capturedFile = null; // Clear captured file
            stopCamera();
        }

        async function performScan() {
            // Get file from either input or captured file
            const file = imageInput.files[0] || window.capturedFile;
            
            if (!file) {
                showNotification("กรุณาเลือกภาพก่อน", "warning");
                return;
            }

            showLoading();
            
            const formData = new FormData();
            formData.append('file', file);
            if (currentLat && currentLng) {
                formData.append('lat', currentLat);
                formData.append('lng', currentLng);
            }

            try {
                const response = await fetch('/predict/', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                displayResult(result);
            } catch (error) {
                displayResult({ 
                    success: false, 
                    detail: `เกิดข้อผิดพลาด: ${error.message}` 
                });
            }
        }

        function showLoading() {
            resultDiv.innerHTML = `
                <div class="result-card">
                    <div class="text-center">
                        <div class="loading-spinner"></div>
                        <p class="text-lg font-medium mt-3 text-green-600">กำลังวิเคราะห์ภาพ...</p>
                        <p class="text-gray-500 mt-1">โปรดรอสักครู่</p>
                    </div>
                </div>
            `;
            resultDiv.classList.remove('hidden');
        }

        function displayResult(result) {
            if (result.success) {
                const confidence = parseFloat(result.confidence.replace('%', ''));
                
                resultDiv.innerHTML = `
                    <div class="result-card">
                        <div class="text-center mb-4">
                            <i class="fas fa-check-circle text-4xl text-green-500 mb-2"></i>
                            <h3 class="text-2xl font-bold text-gray-800">ผลการวิเคราะห์</h3>
                        </div>
                        
                        <div class="space-y-4">
                            <div class="info-card">
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-gray-700">ประเภทขยะ:</span>
                                    <span class="waste-type-badge">${result.waste_type}</span>
                                </div>
                            </div>
                            
                            <div class="info-card">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="font-medium text-gray-700">ความแม่นยำ:</span>
                                    <span class="font-bold text-green-600">${result.confidence}</span>
                                </div>
                                <div class="confidence-bar">
                                    <div class="confidence-fill" style="width: ${confidence}%"></div>
                                </div>
                            </div>
                            
                            <div class="info-card">
                                <div class="flex items-center justify-between">
                                    <span class="font-medium text-gray-700">หมวดหมู่:</span>
                                    <span class="font-semibold text-blue-600">${result.category}</span>
                                </div>
                            </div>
                            
                            <div class="bg-gradient-to-r from-green-50 to-blue-50 p-4 rounded-lg border">
                                <h4 class="font-bold text-gray-800 mb-2">
                                    <i class="fas fa-map-marker-alt mr-2 text-red-500"></i>ศูนย์จัดการขยะ
                                </h4>
                                <p class="font-semibold text-green-700 mb-1">
                                    ${result.disposal_info.center_name || result.disposal_info.message}
                                </p>
                                ${result.disposal_info.address ? 
                                    `<p class="text-gray-600 mb-3">
                                        <i class="fas fa-home mr-1"></i>${result.disposal_info.address}
                                    </p>` : ''
                                }
                                ${result.disposal_info.maps_link ? 
                                    `<a href="${result.disposal_info.maps_link}" target="_blank" 
                                       class="inline-flex items-center bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                                        <i class="fas fa-map mr-2"></i>ดูแผนที่
                                    </a>` : ''
                                }
                            </div>
                        </div>
                    </div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="error-card">
                        <div class="text-center">
                            <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-2"></i>
                            <h3 class="text-xl font-bold text-red-700 mb-2">เกิดข้อผิดพลาด</h3>
                            <p class="text-red-600">${result.detail}</p>
                            <button class="btn-primary mt-4" onclick="clearImage()">
                                <i class="fas fa-redo mr-2"></i>ลองใหม่
                            </button>
                        </div>
                    </div>
                `;
            }
            resultDiv.classList.remove('hidden');
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 transition-all duration-300 ${
                type === 'error' ? 'bg-red-500 text-white' :
                type === 'warning' ? 'bg-yellow-500 text-white' :
                'bg-blue-500 text-white'
            }`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="fas fa-${type === 'error' ? 'times-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'} mr-2"></i>
                    ${message}
                </div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
